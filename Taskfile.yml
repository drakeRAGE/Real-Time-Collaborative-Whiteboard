version: '3'

tasks:
  proto:
    desc: Generate Go + TypeScript code from proto/ via buf
    cmds:
      # Pre-warm the npx cache: buf runs the ts-proto plugin in parallel and
      # concurrent first-time npx installs race on the shared cache.
      - npm exec --yes --package=ts-proto@2.18.3 -- node --version
      - buf generate

  lint:
    desc: Run golangci-lint in each Go module
    cmds:
      - powershell -NoProfile -File scripts/go-each-module.ps1 -Command "golangci-lint run ./..."

  test:
    desc: Run go test in each Go module
    cmds:
      - powershell -NoProfile -File scripts/go-each-module.ps1 -Command "go test ./..."

  build:
    desc: Build all Go modules
    cmds:
      - powershell -NoProfile -File scripts/go-each-module.ps1 -Command "go build ./..."

  up:
    desc: Build and start the local compose stack
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml up -d --build

  down:
    desc: Stop the local compose stack
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml down {{.CLI_ARGS}}

  logs:
    desc: Tail compose logs
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml logs -f {{.CLI_ARGS}}

  dev-frontend:
    desc: Run frontend dev server
    dir: frontend
    cmds:
      - npm run dev
