name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            services/gateway/go.sum
            services/room/go.sum
            services/board/go.sum
            services/chat/go.sum
            services/presence/go.sum
            pkg/config/go.sum
            pkg/logger/go.sum
            pkg/authn/go.sum
            pkg/natsx/go.sum
            pkg/redisx/go.sum
            pkg/otelx/go.sum
            pkg/grpcx/go.sum
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Go modules for CodeQL
        if: matrix.language == 'go'
        run: |
          set -euo pipefail
          modules=(
            .
            services/gateway
            services/room
            services/board
            services/chat
            services/presence
            pkg/config
            pkg/logger
            pkg/authn
            pkg/natsx
            pkg/redisx
            pkg/otelx
            pkg/grpcx
          )
          for module in "${modules[@]}"; do
            (cd "$module" && go build ./...)
          done
      - uses: github/codeql-action/analyze@v3

  codeql:
    if: always()
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Require analysis success
        run: |
          set -euo pipefail
          result="${{ needs.analyze.result }}"
          case "$result" in
            success) ;;
            *)
              echo "analyze result: $result"
              exit 1
              ;;
          esac
