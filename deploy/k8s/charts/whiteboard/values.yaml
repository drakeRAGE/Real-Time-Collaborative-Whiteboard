gateway:
  image:
    repository: whiteboard-gateway
    tag: dev
  env:
    HTTP_ADDR: ":8080"
    NATS_URL: nats://nats:4222
    REDIS_ADDR: redis-master:6379
    ROOM_GRPC_ADDR: room:7001
    BOARD_GRPC_ADDR: board:7002
    CHAT_GRPC_ADDR: chat:7003
    FRONTEND_URL: http://localhost:5173
    SUPABASE_JWT_AUDIENCE: authenticated
    SUPABASE_JWT_ALLOW_HS256: "false"
    LOG_LEVEL: info
  secrets:
    - name: SUPABASE_JWT_ISSUER
      secretName: whiteboard-supabase
      key: issuer
    - name: SUPABASE_JWKS_URL
      secretName: whiteboard-supabase
      key: jwksUrl

room:
  image:
    repository: whiteboard-room
    tag: dev
  env:
    NATS_URL: nats://nats:4222
    GRPC_ADDR: ":7001"
    HTTP_ADDR: ":8001"
    LOG_LEVEL: info
  secrets:
    - name: DATABASE_URL
      secretName: whiteboard-supabase
      key: databaseUrl

board:
  image:
    repository: whiteboard-board
    tag: dev
  env:
    NATS_URL: nats://nats:4222
    REDIS_ADDR: redis-master:6379
    ROOM_GRPC_ADDR: room:7001
    GRPC_ADDR: ":7002"
    HTTP_ADDR: ":8002"
    LOG_LEVEL: info
  secrets:
    - name: DATABASE_URL
      secretName: whiteboard-supabase
      key: databaseUrl

chat:
  image:
    repository: whiteboard-chat
    tag: dev
  env:
    NATS_URL: nats://nats:4222
    REDIS_ADDR: redis-master:6379
    GRPC_ADDR: ":7003"
    HTTP_ADDR: ":8003"
    LOG_LEVEL: info
  secrets:
    - name: DATABASE_URL
      secretName: whiteboard-supabase
      key: databaseUrl

presence:
  image:
    repository: whiteboard-presence
    tag: dev
  env:
    NATS_URL: nats://nats:4222
    REDIS_ADDR: redis-master:6379
    HTTP_ADDR: ":8004"
    LOG_LEVEL: info

# Official NATS chart. JetStream file store stays on the container disk so
# kind does not need a StorageClass. The Service name is nats.
nats:
  fullnameOverride: nats
  config:
    cluster:
      enabled: false
    jetstream:
      enabled: true
      fileStore:
        pvc:
          enabled: false
        maxSize: 1Gi
  natsBox:
    enabled: false

# Official Bitnami Redis chart. Standalone, no password, no volume.
# The Service name is redis-master.
redis:
  fullnameOverride: redis
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  networkPolicy:
    enabled: false
