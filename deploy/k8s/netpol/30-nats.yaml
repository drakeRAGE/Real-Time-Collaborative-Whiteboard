# NATS client port. Same rules in the whiteboard namespace (umbrella chart)
# and the nats namespace (standalone chart). 8222 monitoring stays closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-ingress
  namespace: whiteboard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: room
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: board
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chat
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: presence
      ports:
        - protocol: TCP
          port: 4222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-ingress
  namespace: nats
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: whiteboard
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: whiteboard
          podSelector:
            matchLabels:
              app.kubernetes.io/name: room
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: whiteboard
          podSelector:
            matchLabels:
              app.kubernetes.io/name: board
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: whiteboard
          podSelector:
            matchLabels:
              app.kubernetes.io/name: chat
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: whiteboard
          podSelector:
            matchLabels:
              app.kubernetes.io/name: presence
      ports:
        - protocol: TCP
          port: 4222
