# Only the gateway accepts traffic from the cluster ingress controller.
# Charts must label the gateway pod app.kubernetes.io/name=gateway.
# kubelet probe traffic is not modeled here; Phase 13 confirms the CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
  namespace: whiteboard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
