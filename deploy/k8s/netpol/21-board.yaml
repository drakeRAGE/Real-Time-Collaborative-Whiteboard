# board-service accepts the gateway and NATS. gRPC 7002, health 8002.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: board-ingress
  namespace: whiteboard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: board
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nats
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 7002
        - protocol: TCP
          port: 8002
